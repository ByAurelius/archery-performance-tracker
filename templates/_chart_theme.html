<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
    .viz-root {
        --text-primary: #0b0b0b;
        --text-secondary: #52514e;
        --text-muted: #8a8984;
        --grid: #e8e7e3;
        --series-1: #2a78d6;
        --series-2: #eb6834;
        --series-3: #1baf7a;
        --series-4: #eda100;
        --series-5: #e87ba4;
        --series-6: #008300;
        --series-7: #6250d6;
        --series-8: #e34948;
    }
    .kpi-card { border-radius: 12px; padding: 14px 16px; background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,0.05); height: 100%; }
    .kpi-label { font-size: 0.78rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.4px; }
    .kpi-value { font-size: 1.6rem; font-weight: 600; color: var(--text-primary); line-height: 1.2; }
    .kpi-sub { font-size: 0.78rem; color: var(--text-muted); }
    .chart-note { font-size: 0.8rem; color: var(--text-secondary); }
    .viz-root .card:hover { transform: none; }
    .tone-good { color: #0a7d0a; }
    .tone-warn { color: #b35a00; }
    .tone-info { color: var(--text-secondary); }
    .badge-tone { font-size: 0.75rem; font-weight: 600; border-radius: 6px; padding: 3px 8px; }
    .badge-good { background: #e3f4e3; color: #0a6b0a; }
    .badge-warn { background: #fdeedd; color: #9a4d00; }
    .badge-info { background: #eceae5; color: #52514e; }
    .help { display: inline-block; width: 16px; height: 16px; line-height: 16px; text-align: center; border-radius: 50%;
            background: #e8e7e3; color: #52514e; font-size: 11px; font-weight: 700; cursor: help; margin-left: 4px; vertical-align: 1px; }
    .takeaway { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
    .tech-details > summary { cursor: pointer; font-weight: 600; color: var(--text-secondary); padding: 12px 0; }
    .tech-details[open] > summary { color: var(--text-primary); }
</style>
<script>
    // Shared chart styling: thin marks, recessive grid, text in neutral inks.
    const VIZ = {
        series: ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'],
        text: '#52514e', muted: '#8a8984', grid: '#e8e7e3', point: '#b9b8b2',
    };
    Chart.defaults.font.family = "'Poppins', sans-serif";
    Chart.defaults.font.size = 11;
    Chart.defaults.color = VIZ.text;
    Chart.defaults.borderColor = VIZ.grid;
    Chart.defaults.plugins.legend.labels.boxWidth = 12;
    Chart.defaults.plugins.legend.labels.boxHeight = 12;
    // Legend follows dataset order, not draw order
    Chart.defaults.plugins.legend.labels.sort = (a, b) => a.datasetIndex - b.datasetIndex;
    Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(11,11,11,0.85)';
    Chart.defaults.maintainAspectRatio = false;
    Chart.defaults.elements.line.borderWidth = 2;
    Chart.defaults.elements.bar.borderRadius = 4;

    function hexToRgba(hex, alpha) {
        const n = parseInt(hex.slice(1), 16);
        return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
    }
    function fmt(value, digits = 2, unit = '') {
        return value === null || value === undefined ? '–' : `${Number(value).toFixed(digits)}${unit}`;
    }
    function fmtP(p) {
        return p === null || p === undefined ? '–' : (p < 0.001 ? 'p < 0.001' : `p = ${p.toFixed(3)}`);
    }
</script>
